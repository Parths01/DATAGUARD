name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: dataguard
          POSTGRES_USER: dataguard
          POSTGRES_PASSWORD: dataguard
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dataguard -d dataguard"
          --health-interval 10s
          --health-timeout 5s
          --retries 5
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run tests
        env:
          DATABASE_URL: postgresql://dataguard:dataguard@localhost:5432/dataguard
          APP_ENV: ci
        run: pytest -q
