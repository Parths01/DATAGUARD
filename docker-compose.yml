version: "3.9"

services:
  postgres:
    image: postgres:16
    container_name: dataguard-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dataguard}
      POSTGRES_USER: ${POSTGRES_USER:-dataguard}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dataguard}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  airflow:
    image: apache/airflow:2.9.1-python3.11
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://dataguard:dataguard@postgres:5432/dataguard
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    volumes:
      - ./src:/opt/airflow/src
      - ./dags:/opt/airflow/dags
      - ./config:/opt/airflow/config
    ports:
      - "8080:8080"
    command: bash -c "airflow db init && airflow users create --username admin --firstname Data --lastname Guard --role Admin --email admin@example.com --password admin && airflow webserver"

volumes:
  postgres_data:
